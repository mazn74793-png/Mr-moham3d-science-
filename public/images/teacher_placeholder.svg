<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <circle cx="300" cy="280" r="260" fill="url(#glow)" />

  <!-- Subtle Science / Chemistry Grid & Circles -->
  <g stroke="rgba(45, 212, 191, 0.12)" stroke-width="1.5" fill="none">
    <circle cx="300" cy="280" r="200" stroke-dasharray="6,6" />
    <circle cx="300" cy="280" r="140" />
    <ellipse cx="300" cy="280" rx="220" ry="80" transform="rotate(-30 300 280)" />
    <ellipse cx="300" cy="280" rx="220" ry="80" transform="rotate(30 300 280)" />
  </g>

  <!-- Atomic Nucleus Sparkles -->
  <circle cx="300" cy="280" r="6" fill="#f59e0b" />
  <circle cx="160" cy="200" r="4" fill="#2dd4bf" />
  <circle cx="440" cy="360" r="5" fill="#2dd4bf" />

  <!-- Stylized Educator Silhouette / Avatar -->
  <g transform="translate(300, 270)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="70" fill="url(#tealGrad)" />
    <circle cx="0" cy="-60" r="62" fill="#0f172a" />
    <circle cx="0" cy="-60" r="54" fill="url(#tealGrad)" opacity="0.2" />

    <!-- Glasses Frame (Intellectual touch) -->
    <path d="M -30 -60 Q -20 -60 -10 -60 Q 0 -63 10 -60 Q 20 -60 30 -60" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" />
    <rect x="-35" y="-72" width="26" height="22" rx="6" stroke="#f59e0b" stroke-width="3" fill="rgba(245, 158, 11, 0.1)" />
    <rect x="9" y="-72" width="26" height="22" rx="6" stroke="#f59e0b" stroke-width="3" fill="rgba(245, 158, 11, 0.1)" />

    <!-- Shoulders & Suit Coat -->
    <path d="M -150 160 C -140 60, -90 10, 0 10 C 90 10, 140 60, 150 160 Z" fill="#042f2e" stroke="rgba(45, 212, 191, 0.3)" stroke-width="2" />
    <!-- Shirt Collar & Tie -->
    <path d="M -30 10 L 0 55 L 30 10 Z" fill="#ffffff" />
    <path d="M -10 40 L 0 140 L 10 40 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Badge / Emblem in bottom center -->
  <g transform="translate(300, 560)">
    <rect x="-180" y="0" width="360" height="90" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="38" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" fill="#ffffff">
      أ / محمد مصطفى
    </text>
    <text x="0" y="68" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">
      Senior Chemistry &amp; Science Educator
    </text>
  </g>

  <!-- Upload Prompt Hint below -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="0" width="280" height="42" rx="14" fill="rgba(13, 148, 136, 0.25)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
      📷 في انتظار رفع صورتك الشخصية
    </text>
  </g>
</svg>
